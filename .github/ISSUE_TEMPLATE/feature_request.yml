name: Feature request
description: Suggest a new feature or an improvement for MoripaFishing.
labels: [enhancement, not-reviewed]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an idea. Please describe it in the sections below.
        日本語での記入も歓迎します。
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Describe the feature in a few sentences.
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: Explain the problem this solves or the use case behind it.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe how you would like it to work, such as config, commands or API.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe other approaches or workarounds you have considered.
  - type: dropdown
    id: area
    attributes:
      label: Target area
      description: Which part of the project does this concern? This is for reference only.
      options:
        - Core
        - API
        - Integration
        - Addon
        - Docs
        - Not sure
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add screenshots, links or anything else that helps.
