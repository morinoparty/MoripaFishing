name: preview.yml
on:
  pull_request:
    types: [opened, synchronize, closed]
  workflow_dispatch:

permissions:
  pull-requests: write
  contents: write
  id-token: write
  attestations: write

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.MORINOPARTY_CI_AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.MORINOPARTY_CI_AWS_SECRET_ACCESS_KEY }}
  AWS_EC2_METADATA_DISABLED: true
  AWS_REGION: ${{ secrets.MORINOPARTY_CI_AWS_REGION }}
  AWS_CLI_FILE_ENCODING: UTF-8
  AWS_DEFAULT_S3_SIGNATURE_VERSION: s3v4
  S3_UPLOAD_BUCKET: ${{ secrets.MORINOPARTY_CI_S3_UPLOAD_BUCKET }}
  S3_ENDPOINT: ${{ secrets.MORINOPARTY_CI_S3_ENDPOINT }}
  S3_PUBLIC_URL: ${{ secrets.MORINOPARTY_CI_S3_PUBLIC_URL }}
  # プレビューの公開 URL。アップロード先のキー (moripafishing/<sha>/...) と docs の BASE_PATH に合わせる
  PREVIEW_BASE_URL: ${{ secrets.MORINOPARTY_CI_S3_PUBLIC_URL }}/moripafishing
  PROJECT_NAME: MoripaFishing

jobs:
  # 共通の前処理：コミットSHAを取得
  setup:
    if: ${{ github.event.action != 'closed' }}
    runs-on: ubuntu-latest
    outputs:
      commit_sha: ${{ steps.vars.outputs.commit_sha }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set short git commit SHA
        id: vars
        run: |
          calculatedSha=$(git rev-parse --short HEAD)
          echo "commit_sha=$calculatedSha" >> $GITHUB_OUTPUT

  # Gradle ビルドジョブ（docs と並列実行）
  build-gradle:
    needs: setup
    runs-on: ubuntu-latest
    outputs:
      test_total: ${{ steps.publish-test-results.outputs.total }}
      test_passed: ${{ steps.publish-test-results.outputs.passed }}
      test_skipped: ${{ steps.publish-test-results.outputs.skipped }}
      test_failed: ${{ steps.publish-test-results.outputs.failed }}
      attestation_url: ${{ steps.attest.outputs.attestation-url }}
    env:
      COMMIT_SHORT_SHA: ${{ needs.setup.outputs.commit_sha }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5.4.0
        with:
          distribution: 'temurin'
          java-version: '25'

      # Gradle キャッシュの設定（setup-gradle を使用）
      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          # gradle/actions の Enhanced Caching (extra cache) を利用する。
          # https://github.com/gradle/actions/blob/main/DISTRIBUTION.md
          cache-provider: enhanced
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Change wrapper permissions
        run: chmod +x ./gradlew

      - name: Set project version
        run: |
          sed -i "s/VersionPlaceholder/${{ env.COMMIT_SHORT_SHA }}/" ./gradle.properties

      - name: Build with Gradle
        continue-on-error: true
        run: ./gradlew build

      - name: Install Allure CLI
        if: success() || failure()
        run: |
          curl -sL https://github.com/allure-framework/allure2/releases/download/2.32.2/allure-2.32.2.tgz | tar -xz
          echo "$PWD/allure-2.32.2/bin" >> $GITHUB_PATH

      - name: Aggregate Allure results
        if: success() || failure()
        run: |
          mkdir -p ./build/allure-results-aggregated
          # 各モジュール (bukkit / integrations / addons) の allure-results を1箇所へ集約する。
          # 新しいモジュールを追加してもここを編集せずレポートへ自動的に含まれる。
          find . -type d -path '*/build/allure-results' -not -path '*/allure-results-aggregated/*' | while read -r dir; do
            cp -a "$dir/." ./build/allure-results-aggregated/ 2>/dev/null || true
          done

      - name: Generate Allure report
        if: success() || failure()
        continue-on-error: true
        run: allure generate ./build/allure-results-aggregated -o ./build/allure-report --clean

      - name: Publish test results
        id: publish-test-results
        uses: mikepenz/action-junit-report@d9f48fc87bc235f7e214acf696ca5abc0a986f16 # v6.4.2
        if: success() || failure()
        with:
          report_paths: './**/build/test-results/test/TEST-*.xml'

      - name: Prepare Gradle artifacts
        env:
          SHA: ${{ env.COMMIT_SHORT_SHA }}
          PROJECT_NAME: ${{ env.PROJECT_NAME }}
        run: |
          mkdir -p ./gradle-artifacts/jars
          mkdir -p ./gradle-artifacts/junit
          mkdir -p ./gradle-artifacts/detekt
          mkdir -p ./gradle-artifacts/allure
          mv ./bukkit/build/libs/bukkit-${SHA}.jar "./gradle-artifacts/jars/${PROJECT_NAME}-bukkit-${SHA}.jar"
          mv ./api/build/libs/api-${SHA}.jar "./gradle-artifacts/jars/${PROJECT_NAME}-api-${SHA}.jar"
          # 統合/アドオンモジュールの jar は自動収集する。新しい integration/addon を追加しても
          # ここを編集せずにアーティファクト・コメント表へ自動的に増える。
          for dir in ./integrations/*/ ./addons/*/; do
            [ -d "$dir" ] || continue
            for jar in "$dir"build/libs/*-${SHA}.jar; do
              [ -e "$jar" ] || continue
              mv "$jar" "./gradle-artifacts/jars/${PROJECT_NAME}-$(basename "$jar")"
            done
          done
          # PR コメントの表を動的生成するために jar 一覧を残す
          ls -1 ./gradle-artifacts/jars > ./gradle-artifacts/jars.txt
          # 各モジュールの JUnit HTML レポートをモジュール名のサブフォルダへ集約し、入口となる index を生成する。
          found_junit=false
          while IFS= read -r report; do
            module_path="${report#./}"
            module="${module_path%%/build/reports/tests/test}"
            module="${module//\//-}"
            mkdir -p "./gradle-artifacts/junit/${module}"
            cp -r "${report}/." "./gradle-artifacts/junit/${module}/"
            found_junit=true
          done < <(find . -type d -path '*/build/reports/tests/test' -not -path '*/gradle-artifacts/*')
          if [ "$found_junit" = true ]; then
            {
              echo '<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8"><title>JUnit Reports</title></head><body>'
              echo '<h1>JUnit Reports</h1><ul>'
              for dir in ./gradle-artifacts/junit/*/; do
                [ -d "$dir" ] || continue
                name="$(basename "$dir")"
                echo "<li><a href=\"./${name}/index.html\">${name}</a></li>"
              done
              echo '</ul></body></html>'
            } > ./gradle-artifacts/junit/index.html
          else
            echo "No JUnit reports found"
          fi
          # detekt はモジュールごとに実行されるため、JUnit と同じくモジュール名のサブフォルダへ集約する。
          found_detekt=false
          while IFS= read -r report; do
            module_path="${report#./}"
            module="${module_path%%/build/reports/detekt}"
            module="${module//\//-}"
            mkdir -p "./gradle-artifacts/detekt/${module}"
            cp -r "${report}/." "./gradle-artifacts/detekt/${module}/"
            found_detekt=true
          done < <(find . -type d -path '*/build/reports/detekt' -not -path '*/gradle-artifacts/*')
          if [ "$found_detekt" = true ]; then
            {
              echo '<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8"><title>Detekt Reports</title></head><body>'
              echo '<h1>Detekt Reports</h1><ul>'
              for dir in ./gradle-artifacts/detekt/*/; do
                [ -d "$dir" ] || continue
                name="$(basename "$dir")"
                echo "<li><a href=\"./${name}/detekt.html\">${name}</a></li>"
              done
              echo '</ul></body></html>'
            } > ./gradle-artifacts/detekt/index.html
          else
            echo "No Detekt reports found"
          fi
          cp -r ./build/allure-report/* ./gradle-artifacts/allure/ || echo "No Allure reports found"

      # GitHub Attestations で署名
      - name: Attest JAR artifacts
        id: attest
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: './gradle-artifacts/jars/*.jar'

      - name: Upload Gradle artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gradle-artifacts
          path: ./gradle-artifacts
          retention-days: 1

  # JitPack SNAPSHOT ビルドをトリガー
  trigger-jitpack:
    needs: [setup, build-gradle]
    runs-on: ubuntu-latest
    steps:
      - name: Trigger JitPack builds
        run: |
          BRANCH="${{ github.head_ref }}"
          COMMIT="${{ github.event.pull_request.head.sha }}"
          echo "Triggering JitPack builds for branch: $BRANCH, commit: $COMMIT"
          curl -s "https://jitpack.io/api/builds/com.github.morinoparty/MoripaFishing/${BRANCH}-SNAPSHOT" || true
          curl -s "https://jitpack.io/api/builds/com.github.morinoparty/MoripaFishing/${COMMIT}" || true
          echo "JitPack builds triggered"

  # Docs ビルドジョブ（gradle と並列実行）
  build-docs:
    needs: setup
    runs-on: ubuntu-latest
    env:
      COMMIT_SHORT_SHA: ${{ needs.setup.outputs.commit_sha }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5.4.0
        with:
          distribution: 'temurin'
          java-version: '25'

      # Gradle キャッシュの設定（Dokka 生成用）
      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          # gradle/actions の Enhanced Caching (extra cache) を利用する。
          # https://github.com/gradle/actions/blob/main/DISTRIBUTION.md
          cache-provider: enhanced
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        name: Install pnpm
        with:
          version: 10
          run_install: false

      # pnpm キャッシュの設定
      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        name: Setup pnpm cache
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Change wrapper permissions
        run: chmod +x ./gradlew

      - name: Install docs dependencies
        working-directory: docs
        run: pnpm install

      - name: Generate Dokka API documentation
        run: ./gradlew dokkaGenerate

      - name: Build Fumadocs
        working-directory: docs
        env:
          BASE_PATH: /moripafishing/${{ env.COMMIT_SHORT_SHA }}/docs
        run: pnpm run build

      - name: Upload docs artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-artifacts
          path: ./docs/out
          retention-days: 1

  # S3 アップロードジョブ（JARs, Docs, レポート）
  upload-s3:
    needs: [setup, build-gradle, build-docs]
    runs-on: ubuntu-latest
    env:
      COMMIT_SHORT_SHA: ${{ needs.setup.outputs.commit_sha }}
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ./artifacts

      - name: Prepare upload directory
        run: |
          mkdir -p ./upload
          cp -r ./artifacts/gradle-artifacts/jars ./upload/ || echo "No JARs"
          cp -r ./artifacts/gradle-artifacts/junit ./upload/ || echo "No JUnit reports"
          cp -r ./artifacts/gradle-artifacts/detekt ./upload/ || echo "No Detekt reports"
          cp -r ./artifacts/gradle-artifacts/allure ./upload/ || echo "No Allure reports"
          mkdir -p ./upload/docs
          mv ./artifacts/docs-artifacts/* ./upload/docs/

      # rclone の最新リリースを入れる (apt の 1.60 は R2 への転送で NotImplemented が多発する)。
      # 取得したバイナリは actions のキャッシュに保存され、アクション自体の更新は Dependabot が行う
      - uses: AnimMouse/setup-rclone@26ef2133e09fd383329a1d4c1fbe6a71db1976c9 # v1.12.0

      # aws s3 cp はファイルごとの処理が遅く、--only-show-errors では進捗も出ないため rclone で送る。
      # rclone は単一プロセスで接続を再利用しながら高い並列数で転送し、5 秒ごとに進捗をログに出す
      - name: Upload to S3
        env:
          RCLONE_CONFIG_S3_TYPE: s3
          RCLONE_CONFIG_S3_PROVIDER: Cloudflare
          RCLONE_CONFIG_S3_ACCESS_KEY_ID: ${{ env.AWS_ACCESS_KEY_ID }}
          RCLONE_CONFIG_S3_SECRET_ACCESS_KEY: ${{ env.AWS_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_S3_REGION: ${{ env.AWS_REGION }}
          RCLONE_CONFIG_S3_ENDPOINT: ${{ env.S3_ENDPOINT }}
          RCLONE_CONFIG_S3_NO_CHECK_BUCKET: "true"
        run: |
          # secret が空のまま進むと、誤ったキーにアップロードしたり PR コメントの URL が壊れたりするため止める
          for name in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_REGION S3_ENDPOINT S3_UPLOAD_BUCKET S3_PUBLIC_URL; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is empty (check the MORINOPARTY_CI_* organization secrets)"
              exit 1
            fi
          done

          # xargs から起動する sh でも参照できるよう export する
          export PREFIX="moripafishing/${COMMIT_SHORT_SHA}"

          # JAR・Docs・レポートをまとめて 1 プロセスで送る
          rclone copy ./upload "s3:${S3_UPLOAD_BUCKET}/${PREFIX}" \
            --transfers=32 --checkers=32 --stats=5s --stats-one-line -v

          # 公開ドメインはディレクトリの URL から index.html を自動で解決しない。
          # docs のリンクは末尾スラッシュ (trailingSlash: true) なので、各 index.html を
          # 末尾スラッシュのキーとしても置き、リンク先や直接開いた URL が 404 にならないようにする
          find ./upload/docs -name index.html -print0 \
            | xargs -0 -P 16 -I {} sh -c '
                relative="${1#./upload/docs/}"
                aws s3api put-object \
                  --bucket "$S3_UPLOAD_BUCKET" \
                  --key "$PREFIX/docs/${relative%index.html}" \
                  --body "$1" \
                  --content-type "text/html; charset=utf-8" \
                  --endpoint-url "$S3_ENDPOINT" > /dev/null
              ' _ {}

          echo "S3 upload completed"

  # コメント作成ジョブ
  comment:
    needs: [setup, build-gradle, upload-s3]
    runs-on: ubuntu-latest
    if: ${{ github.event.action == 'opened' || github.event.action == 'synchronize' }}
    env:
      COMMIT_SHORT_SHA: ${{ needs.setup.outputs.commit_sha }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Get limit time
        id: limit-time
        run: |
          limit_time=$(date -d "7 days" +%Y-%m-%d)
          echo "LIMIT_TIME=$limit_time" >> $GITHUB_ENV

      # jar 一覧 (jars.txt) を取得して表を動的生成するため、ビルド成果物を取り込む
      - name: Download Gradle artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: gradle-artifacts
          path: ./gradle-artifacts

      - name: Build JAR table rows
        id: jar-rows
        env:
          S3_DOWNLOAD_BASE: "${{ env.PREVIEW_BASE_URL }}/${{ env.COMMIT_SHORT_SHA }}/jars"
          SHA: ${{ env.COMMIT_SHORT_SHA }}
          PROJECT_NAME: ${{ env.PROJECT_NAME }}
        run: |
          # バイト数を読みやすい単位に変換する (1 MiB 以上は MB、それ未満は KB)
          human_size() {
            local bytes
            bytes=$(stat -c %s "$1")
            if [ "$bytes" -ge 1048576 ]; then
              awk -v b="$bytes" 'BEGIN { printf "%.1f MB", b / 1048576 }'
            else
              awk -v b="$bytes" 'BEGIN { printf "%.1f KB", b / 1024 }'
            fi
          }
          {
            echo "rows<<ROWS_EOF"
            while read -r f; do
              [ -n "$f" ] || continue
              label="${f#${PROJECT_NAME}-}"
              label="${label%-${SHA}.jar}"
              echo "| ${label} | [${f}](${S3_DOWNLOAD_BASE}/${f}) | $(human_size "./gradle-artifacts/jars/${f}") |"
            done < ./gradle-artifacts/jars.txt
            echo "ROWS_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create comment file
        env:
          JUNIT_REPORT_URL: "${{ env.PREVIEW_BASE_URL }}/${{ env.COMMIT_SHORT_SHA }}/junit/index.html"
          ALLURE_REPORT_URL: "${{ env.PREVIEW_BASE_URL }}/${{ env.COMMIT_SHORT_SHA }}/allure/index.html"
          DETEKT_REPORT_URL: "${{ env.PREVIEW_BASE_URL }}/${{ env.COMMIT_SHORT_SHA }}/detekt/index.html"
          DOCS_PREVIEW_URL: "${{ env.PREVIEW_BASE_URL }}/${{ env.COMMIT_SHORT_SHA }}/docs/index.html"
          DOKKA_URL: "${{ env.PREVIEW_BASE_URL }}/${{ env.COMMIT_SHORT_SHA }}/docs/dokka/index.html"
          ATTESTATION_URL: "${{ needs.build-gradle.outputs.attestation_url }}"
          LIMIT_TIME: ${{ env.LIMIT_TIME }}
          JAR_ROWS: ${{ steps.jar-rows.outputs.rows }}
        run: |
          cat << EOF > comment.md
          ## 🚀 Preview of ${{ github.event.repository.name }}

          ### 📦 Preview JARs
          Available for 7 days (until $LIMIT_TIME)
          | Artifact | Download | Size |
          |----------|----------|------|
          $JAR_ROWS

          > 📜 **Attestation** (SLSA provenance): [Verify on GitHub]($ATTESTATION_URL) or run \`gh attestation verify <jar-file> --owner morinoparty\`

          ### 📖 Documentation & Reports
          | Resource | Link |
          |----------|------|
          | 📖 Documentation | [Preview]($DOCS_PREVIEW_URL) |
          | 📖 Dokka API | [Preview]($DOKKA_URL) |
          | 🧪 Allure Report | [Report]($ALLURE_REPORT_URL) |
          | 🧪 JUnit Report | [Report]($JUNIT_REPORT_URL) |
          | 🔍 Detekt Report | [Report]($DETEKT_REPORT_URL) |

          ### 🧪 Test Summary
          | Tests | Passed | Skipped | Failed |
          |-------|--------|---------|--------|
          | ${{ needs.build-gradle.outputs.test_total }} | ${{ needs.build-gradle.outputs.test_passed }} ✅ | ${{ needs.build-gradle.outputs.test_skipped }} ⏭️ | ${{ needs.build-gradle.outputs.test_failed }} ❌ |
          EOF

      - name: Create PR comment
        run: gh pr comment ${{ github.event.number }} --body-file comment.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
