name: deploy docs

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "docs/**"

permissions:
  contents: write

jobs:
  # Dokka 生成ジョブ
  generate-dokka:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: 'temurin'
          java-version: '25'

      # Gradle キャッシュの設定（setup-gradle を使用）
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          # configuration cache を保存・復元するための暗号化キー (未設定なら configuration cache は保存されない)
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Change wrapper permissions
        run: chmod +x ./gradlew

      - name: Generate Dokka
        run: ./gradlew dokkaGenerate

      - name: Upload Dokka artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dokka-output
          path: ./docs/public/dokka
          retention-days: 1

  # Docs ビルドジョブ（Dokka 完了後に実行）
  build:
    needs: [generate-dokka]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # configure-pages が Pages の設定 (公開 URL) を読むために必要
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # GitHub Pages の公開パスを取得する
      # カスタムドメインなら "" 、https://<owner>.github.io/<repo>/ なら "/<repo>" になる
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      # Vite+ (vp)、Node (docs/.node-version)、pnpm (docs/package.json の packageManager) をまとめて入れ、
      # lockfile を固定したまま docs の依存を install する。vp のバージョンは docs/pnpm-workspace.yaml の catalog から決まる
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          working-directory: docs
          node-version-file: .node-version # working-directory からの相対パス
          cache: true # pnpm store を lockfile ごとにキャッシュ
          run-install: |
            args: ["--frozen-lockfile"]

      # Dokka artifacts をダウンロード
      - name: Download Dokka artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dokka-output
          path: ./docs/public/dokka

      # build スクリプトは mpm のリポジトリインデックス (public/mpm/paper/index.json) を生成してから vp build する
      - name: Build
        working-directory: docs
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          pnpm run build

      - name: Upload Build Artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./docs/out

  deploy:
    name: Deploy to GitHub Pages
    needs: build

    # Grant GITHUB_TOKEN the permissions required to make a Pages deployment
    permissions:
      pages: write # to deploy to Pages
      id-token: write # to verify the deployment originates from an appropriate source

    # Deploy to the github-pages environment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
