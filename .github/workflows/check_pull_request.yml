name: Check pull request

on: [ pull_request ]


permissions:
  statuses: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Set commit status as pending
        uses: myrotvorets/set-commit-status-action@3730c0a348a2ace3c110851bed53331bc6406e9f # v2.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          status: pending
          context: Check pull request

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5.4.0
        with:
          distribution: 'temurin'
          java-version: '25'

      # Gradle キャッシュの設定（setup-gradle を使用、より効率的）
      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          # gradle/actions の Enhanced Caching (extra cache) を利用する。
          # https://github.com/gradle/actions/blob/main/DISTRIBUTION.md
          cache-provider: enhanced
          cache-read-only: true  # PR では読み取り専用

      - name: Change wrapper permissions
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew build -x test

      # MoripaFishingLoader (paper-plugin.yml) と plugin.yml の libraries は、Paper がサーバー起動時に
      # Maven Central のミラー (Google) から取得する。ミラーへの反映は Maven Central より遅れるため、
      # 未反映のバージョンが入ると起動できなくなる
      - name: Check plugin libraries are available on Paper's Maven Central mirror
        run: |
          MIRROR=https://maven-central.storage-download.googleapis.com/maven2
          missing=0
          while read -r coordinate; do
            [ -n "$coordinate" ] || continue
            IFS=: read -r group artifact version <<< "$coordinate"
            url="$MIRROR/${group//.//}/$artifact/$version/$artifact-$version.pom"
            if curl -sfI "$url" > /dev/null; then
              echo "OK      $coordinate"
            else
              echo "::error::$coordinate is not available on $MIRROR yet"
              missing=1
            fi
          done < bukkit/build/resources/main/paper-libraries.txt
          exit $missing

      - name: Set final commit status
        uses: myrotvorets/set-commit-status-action@3730c0a348a2ace3c110851bed53331bc6406e9f # v2.0.1
        if: always()
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          status: ${{ job.status }}
          context: Check pull request