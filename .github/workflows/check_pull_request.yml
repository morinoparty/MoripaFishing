name: Check pull request

on:
  pull_request:
  # main でもビルドして Gradle のキャッシュ (依存・ビルドキャッシュ) を保存し、PR から読めるようにする
  push:
    branches: [ main ]


permissions:
  statuses: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Set commit status as pending
        if: github.event_name == 'pull_request'
        uses: myrotvorets/set-commit-status-action@3730c0a348a2ace3c110851bed53331bc6406e9f # v2.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          status: pending
          context: Check pull request

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: 'temurin'
          java-version: '25'

      # Gradle キャッシュの設定（setup-gradle を使用、より効率的）
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          # configuration cache を保存・復元するための暗号化キー (未設定なら configuration cache は保存されない)
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          # PR では読み取り専用にし、main へのプッシュでのみキャッシュを保存する
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Change wrapper permissions
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew build -x test

      # MoripaFishingLoader (paper-plugin.yml) のライブラリは、Paper がサーバー起動時に Maven Central のミラー (Google) から取得する。
      # ミラーへの反映は Maven Central より遅れるため、未反映のバージョンが入ると起動できなくなる
      - name: Check plugin libraries are available on Paper's Maven Central mirror
        run: |
          MIRROR=https://maven-central.storage-download.googleapis.com/maven2
          missing=0
          # 最終行に改行がなくても読み飛ばさないようにする
          while read -r coordinate || [ -n "$coordinate" ]; do
            [ -n "$coordinate" ] || continue
            IFS=: read -r group artifact version <<< "$coordinate"
            url="$MIRROR/${group//.//}/$artifact/$version/$artifact-$version.pom"
            if curl -sfI "$url" > /dev/null; then
              echo "OK      $coordinate"
            else
              echo "::error::$coordinate is not available on $MIRROR yet"
              missing=1
            fi
          done < bukkit/build/resources/main/paper-libraries.txt
          exit $missing

      - name: Set final commit status
        uses: myrotvorets/set-commit-status-action@3730c0a348a2ace3c110851bed53331bc6406e9f # v2.0.1
        if: always() && github.event_name == 'pull_request'
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          status: ${{ job.status }}
          context: Check pull request

  # docs の lint・整形 (Oxlint / Oxfmt) と型チェック
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Vite+ (vp)、Node (docs/.node-version)、pnpm (docs/package.json の packageManager) をまとめて入れ、
      # lockfile を固定したまま install する。vp check は vite.config.ts を読むので install が必要
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          working-directory: docs
          node-version-file: .node-version # working-directory からの相対パス
          cache: true # pnpm store を lockfile ごとにキャッシュ
          run-install: |
            args: ["--frozen-lockfile"]

      - name: Check
        working-directory: docs
        run: pnpm run check:ci

      - name: Typecheck
        working-directory: docs
        run: pnpm run typecheck
