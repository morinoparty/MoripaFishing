name: test

on: [pull_request]

permissions:
  pull-requests: write
  contents: write

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: 'temurin'
          java-version: '25'

      # Gradle キャッシュの設定（setup-gradle を使用）
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          # configuration cache を保存・復元するための暗号化キー (未設定なら configuration cache は保存されない)
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          # PR では読み取り専用にする (キャッシュの保存は check_pull_request の main へのプッシュで行う)
          cache-read-only: true

      - name: Change wrapper permissions
        run: chmod +x ./gradlew

      - name: Test with Gradle
        run: ./gradlew check

      - name: Publish test results
        uses: mikepenz/action-junit-report@a16be3a69023e9bd7e748ede768b3282ea7b30ce # v6.7.1
        if: success() || failure()
        with:
          report_paths: '**/build/test-results/test/TEST-*.xml'