name: Release Drafter

on:
  push:
    branches:
      - main
  # PR タイトル・ブランチ名・変更ファイルからラベルを付ける（autolabeler）
  pull_request:
    types: [ opened, reopened, synchronize, edited ]

permissions:
  contents: write
  pull-requests: write

jobs:
  # main への push ではドラフトリリースだけを更新する
  release-drafter:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: release-drafter
      cancel-in-progress: false
    steps:
      # GitHub side sometimes hasn't finished associating the just-merged commit with its
      # pull request yet when this push event fires, which makes release-drafter skip that
      # PR for one run. Give it a moment to catch up before drafting.
      - run: sleep 30
      - uses: release-drafter/release-drafter@978bb0b30c5ee8cdd332ced253758157150d43f0 # v7.10.0
        with:
          publish: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # PR ではラベル付けだけを行う
  autolabeler:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: release-drafter/release-drafter/autolabeler@978bb0b30c5ee8cdd332ced253758157150d43f0 # v7.10.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
