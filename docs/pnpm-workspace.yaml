# docs/ は単独の pnpm プロジェクト (リポジトリ直下は Gradle のため workspace にしない)

# インストール時にビルドスクリプトを実行してよい依存
onlyBuiltDependencies:
    - "@parcel/watcher"
    - esbuild

# Vite+ のバージョンはここで一元管理する
catalog:
    vite: npm:@voidzero-dev/vite-plus-core@1.6.0
    vite-plus: 1.6.0

overrides:
    # 依存が参照する vite も Vite+ のコアに揃え、vite が二重に入らないようにする
    vite@*: "catalog:"

peerDependencyRules:
    # vite-plus-core の版番号は各プラグインの peer 範囲 (vite ^8 など) に一致しないため許可する
    allowAny:
        - vite
    allowedVersions:
        vite: "*"

# 公開直後の Vite+ を入れられるよう、pnpm の公開待ち期間から除外する
# catalog の版を上げるときは、ここの版番号も合わせて更新する
minimumReleaseAgeExclude:
    - "@voidzero-dev/vite-plus-core@1.6.0"
    - "@voidzero-dev/vite-plus-darwin-arm64@1.6.0"
    - "@voidzero-dev/vite-plus-darwin-x64@1.6.0"
    - "@voidzero-dev/vite-plus-linux-arm64-gnu@1.6.0"
    - "@voidzero-dev/vite-plus-linux-arm64-musl@1.6.0"
    - "@voidzero-dev/vite-plus-linux-x64-gnu@1.6.0"
    - "@voidzero-dev/vite-plus-linux-x64-musl@1.6.0"
    - "@voidzero-dev/vite-plus-win32-arm64-msvc@1.6.0"
    - "@voidzero-dev/vite-plus-win32-x64-msvc@1.6.0"
    - vite-plus@1.6.0
