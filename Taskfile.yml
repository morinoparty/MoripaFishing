# https://taskfile.dev

version: '3'

tasks:
  docs:
    dir: docs
    cmds:
      - pnpm install
      - pnpm dev
    silent: true

  check:
    cmds:
      - ./gradlew check
    silent: true

  fmt:
    cmds:
      - ./gradlew ktlintFormat
    silent: true

  build:
    cmds:
      - ./gradlew clean build
    silent: true

  run:
    cmds:
      - ./gradlew clean runServer
    silent: true

  dokka:
    cmds:
      - ./gradlew clean dokkaGenerate
    silent: true

  test:
    cmds:
      - ./gradlew clean test
    silent: true

  unlock:
    cmds:
      - rm bukkit/run/**/session.lock
    silent: true
