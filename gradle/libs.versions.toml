[versions]
# paper と mock-bukkit のアーティファクト名 (mockbukkit-v<MC>) は必ず同時に更新する。
# Dependabot はアーティファクト名を更新できないため、Paper の MC バージョンを上げるときは手動で合わせる。
paper = "26.3.build.246-stable"
cloud = "2.1.0"
cloudPaper = "2.0.1"
serialization = "1.12.0"
kaml = "0.104.0"
junit = "6.1.3"
mockBukkit = "4.120.0"
ktlint = "14.2.0"
mavenPublish = "0.37.0"
detekt = "2.0.0-alpha.6"
allure = "2.35.5"

[libraries]
paper-api = { group = "io.papermc.paper", name = "paper-api", version.ref = "paper" }

cloud = { group = "org.incendo", name = "cloud-core", version.ref = "cloud" }
cloud-annotations = { group = "org.incendo", name = "cloud-annotations", version.ref = "cloud" }
cloudPaper = { group = "org.incendo", name = "cloud-paper", version.ref = "cloudPaper" }

kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }
kaml = { group = "com.charleskorn.kaml", name = "kaml", version.ref = "kaml" }

exp4j = { group = "net.objecthunter", name = "exp4j", version = "0.4.8" }

mock-bukkit = { group = "org.mockbukkit.mockbukkit", name = "mockbukkit-v26.3", version.ref = "mockBukkit" }
junit-bom = { group = "org.junit", name = "junit-bom", version.ref = "junit" }
junit-jupiter = { group = "org.junit.jupiter", name = "junit-jupiter" }
junit-platform-launcher = { group = "org.junit.platform", name = "junit-platform-launcher" }
allure-junit5 = { group = "io.qameta.allure", name = "allure-junit5", version.ref = "allure" }

[plugins]
run-paper = { id = "xyz.jpenilla.run-paper", version = "3.1.0" }
resource-factory = { id = "xyz.jpenilla.resource-factory", version = "1.4.0" }
shadow = { id = "com.gradleup.shadow", version = "9.6.1" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version = "2.4.21" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version = "2.4.21" }
dokka = { id = "org.jetbrains.dokka", version = "2.3.0" }
dokka-javadoc = { id = "org.jetbrains.dokka-javadoc", version = "2.3.0" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint" }
maven-publish = { id = "com.vanniktech.maven.publish", version.ref = "mavenPublish" }
detekt = { id = "dev.detekt", version.ref = "detekt" }

[bundles]
commands = ["cloud", "cloudPaper", "cloud-annotations"]
